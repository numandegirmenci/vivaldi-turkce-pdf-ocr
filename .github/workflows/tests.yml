name: Kod testleri

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Bagimliliklari yukle
        run: npm install --no-audit --no-fund
      - name: Birim ve görünüm testleri
        run: npm test
      - name: Dağıtım dosyalarını hazırla
        run: npm run build
      - name: Gerçek PDF ve Türkçe font entegrasyon testleri
        run: npm test
