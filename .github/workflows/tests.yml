name: Kod testleri

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Bagimliliklari yukle
        run: npm install --no-audit --no-fund
      - name: WhatsApp entegrasyon JS sözdizimini doğrula
        run: |
          node --check Eklenti/whatsapp-page.js
          node --check Eklenti/whatsapp-content.js
          node --check Eklenti/whatsapp-transfer.js
          node --check Eklenti/attachment-capture.js
          node --check Eklenti/visual-edits.mjs
          node --check Eklenti/text-style.mjs
          node --check Eklenti/scan-typography.mjs
          node --check Eklenti/selective-repair.mjs
          node --check Eklenti/edit-geometry.mjs
          node --check Eklenti/visual-editor.mjs
          node --check Eklenti/export-pdf.mjs
          node --check Eklenti/viewer.js
      - name: Birim ve görünüm testleri
        run: npm test
      - name: Dağıtım dosyalarını hazırla
        run: npm run build
      - name: Gerçek PDF ve Türkçe font entegrasyon testleri
        run: npm test
