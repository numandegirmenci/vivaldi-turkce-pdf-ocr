<!doctype html><html lang="tr"><head><meta charset="utf-8"><title>PDF OCR</title>
<style>body{width:285px;padding:14px;background:#f8fafc;color:#0f172a;font:14px system-ui;margin:0}h2{font-size:17px;margin:0 0 8px}p{line-height:1.5}button{border:0;border-radius:9px;padding:9px;background:#164e63;color:white;width:100%;cursor:pointer;margin-top:9px}label{display:flex;align-items:center;gap:8px;margin:15px 0}small{display:block;color:#64748b;line-height:1.5}button:disabled{opacity:.6;cursor:default}#whatsapp{border:0;border-top:1px solid #cbd5e1;padding:8px 0 0;margin:12px 0 0}#wa-files button{text-align:left;overflow-wrap:anywhere}#wa-status{font-size:13px}</style>
</head><body><h2>Türkçe PDF OCR</h2><label><input type="checkbox" id="auto" checked> PDF ve fotoğraf bağlantılarını otomatik aç</label><button id="current">Bu sekmedeki belgeyi OCR ile aç</button><button id="blank">PDF dosyası seç</button><section id="whatsapp" hidden aria-label="WhatsApp belge yakalama">
<h2>WhatsApp belge yakalama</h2>
<button id="wa-toggle" type="button" disabled>Yakalamayı aç</button>
<button id="wa-preview" type="button" hidden>Açık PDF önizlemesini yakala</button>
<div id="wa-files"></div><p id="wa-status" role="status"></p>
</section><p id="msg"></p><small>PDF, tarayıcı içindeki ayrı görüntüleyicide açılır. OCR yerelde yapılır. Outlook/OneDrive fotoğrafları ve belge bağlantıları için sağ tıkla → PDF / görseli OCR ile aç. Yalnızca önizleme sunuluyorsa dosyayı indirip PDF seç ile aç.</small><script src="popup.js"></script></body></html>
