<!doctype html>
<html lang="tr"><head><meta charset="utf-8">
<link rel="stylesheet" href="/Eklenti/viewer.css"></head><body>
<pre id="result">RUNNING</pre>
<script type="module">
import {prepareEditCandidates} from '/Eklenti/edit-geometry.mjs';
import {normalizeVisibleEdit} from '/Eklenti/visual-edits.mjs';
import {analyzeScanTypography,renderScanReplacement} from '/Eklenti/scan-typography.mjs';
import {planPaperRestoration,compositeCleanup} from '/Eklenti/paper-restoration.mjs';

function assert(condition,message){if(!condition)throw new Error(message);}
async function imageFromData(data){
  const img=new Image();
  await new Promise((ok,fail)=>{img.onload=ok;img.onerror=fail;img.src=data;});
  return img;
}
try{
  await Promise.all([
    document.fonts.load('700 54px "NotoSansOcr"'),
    document.fonts.load('700 54px "OCRRobotoCondensed"'),
    document.fonts.load('400 54px "OCRAnton"'),
    document.fonts.load('700 54px "OCRArchivoNarrow"'),
    document.fonts.load('700 54px "OCROswald"')
  ]);
  const canvas=document.createElement('canvas');
  canvas.width=800;canvas.height=300;
  const context=canvas.getContext('2d',{willReadFrequently:true});
  context.fillStyle='#fbfbfb';context.fillRect(0,0,800,300);
  const x=255,baseline=136;
  context.font='700 54px "NotoSansOcr"';
  context.fillStyle='#2b2b2c';
  context.fillText('AVCILAR',x,baseline);
  const m=context.measureText('AVCILAR');
  const box={x0:Math.max(0,x-2),y0:baseline-m.actualBoundingBoxAscent-2,
    x1:x+m.width+2,y1:baseline+m.actualBoundingBoxDescent+2};
  const words=[
    {text:'AVCILAR',bbox:box},
    {text:'BELEDİYE',bbox:{x0:55,y0:193,x1:245,y1:232}},
    {text:'BAŞKANLIĞI',bbox:{x0:260,y0:193,x1:550,y1:232}}
  ];
  const edit=normalizeVisibleEdit({box,text:'AKCIKAR',original:'AVCILAR',
    sourceKind:'ocr',sourceIndex:0,sourceIndices:[0],ink:'#2b2b2c',fill:'#fbfbfb',bold:true},
    canvas.width,canvas.height);
  const options=prepareEditCandidates({box:edit.box,pageWidth:800,pageHeight:300,
    words,sourceIndex:0,sourceIndices:[0],sourceKind:'ocr'});
  assert(options.length>0,'no OCR crop options available');
  let patch=null,failed=[];
  for(const geometry of options){
    edit.box=geometry.box;
    try{
      const typography=analyzeScanTypography(canvas,words,box,'AVCILAR',
        {ink:edit.ink,fill:edit.fill,bold:true});
      typography.targetHeight=geometry.targetHeight;
      patch=renderScanReplacement(canvas,edit,typography);
      break;
    }catch(error){failed.push(error.message);}
  }
  assert(patch!==null,'all crop candidates rejected: '+failed.join(' | '));
  assert(patch.transparency==='bounded-restoration','ghost-free restoration not used');
  assert(patch.repairedPixels>50,'old printed characters were not removed');
  const selected=context.getImageData(edit.box.x0,edit.box.y0,
    edit.box.x1-edit.box.x0,edit.box.y1-edit.box.y0);
  const repair=planPaperRestoration(selected,{ink:edit.ink,fill:edit.fill});
  const cleaned=compositeCleanup(selected,repair);
  let ghosts=0;
  for(let y=repair.height*.18|0;y<repair.height*.82;y++)
    for(let x=repair.width*.06|0;x<repair.width*.94;x++){
      const k=(y*repair.width+x)*4;
      if(cleaned.data[k]<170)ghosts++;
    }
  assert(ghosts===0,'old glyph strokes remain visible after cleanup: '+ghosts);
  const before=context.getImageData(0,0,800,300).data;
  const approved=await imageFromData(patch.png);
  context.drawImage(approved,edit.box.x0,edit.box.y0);
  const after=context.getImageData(0,0,800,300).data;
  let changed=0,damage=0;
  for(let y=0;y<300;y++)for(let x=0;x<800;x++){
    const k=(y*800+x)*4;
    const diff=Math.abs(before[k]-after[k])+Math.abs(before[k+1]-after[k+1])+
      Math.abs(before[k+2]-after[k+2]);
    if(diff>0){
      changed++;
      if(x<edit.box.x0||x>=edit.box.x1||y<edit.box.y0||y>=edit.box.y1)damage++;
    }
  }
  assert(changed>60,'new text did not visibly change any pixels');
  assert(damage===0,'unchanged outside-area pixels were damaged: '+damage);
  document.querySelector('#result').textContent='PASS: '+changed+' pixels changed, old ghost pixels = 0, outside damage = 0, attempts='+options.length;
  document.querySelector('#result').dataset.result='pass';
}catch(error){
  document.querySelector('#result').textContent='FAIL: '+error.stack;
  document.querySelector('#result').dataset.result='fail';
}
</script></body></html>
